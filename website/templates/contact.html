<section id="contact">
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<body>
    <div class="container mt-5 mb-4">
        <p class="fs-3 mb-1"><b>contact</b></p>
        <p class="fs-5 text-secondary">
            Donec ullamcorper nulla non metus auctor fringilla. Vestibulum id ligula porta felis euismod semper.
            Praesent commodo cursus magna, vel scelerisque nisl consectetur. Fusce dapibus, tellus ac cursus commodo.
        </p>
    </div>
    <div class="container mt-5">
        <div class="contacto bg-light p-4 rounded w-75 mx-auto">

            <div class="row mb-3">
                <label for="inputEmail" class="col-sm-2 col-form-label fw-bold text-end">Your E-mail</label>
                <div class="col-sm-10">
                    <input type="email" class="form-control" id="inputEmail" placeholder="Your email">
                </div>
            </div>

            <div class="row mb-3">
                <label for="inputTextarea" class="col-sm-2 col-form-label fw-bold text-end">Your message</label>
                <div class="col-sm-10">
                    <textarea class="form-control" id="inputTextarea" rows="4"
                        placeholder="Please enter your message here..."></textarea>
                </div>
            </div>

            <div class="row d-flex justify-content-end">
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
</section>
